[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ingestor",
    "crates/worm",
    "crates/regime",
    "crates/quant",
    "crates/alerts",
    "crates/digest",
    "apps/vigil",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
