[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ingestor",
    "crates/worm",
    "crates/analysis",
    "crates/alerts",
    "crates/digest",
    "crates/market-types",
    "crates/governance",
    "crates/quantabeta-bridge",
    "apps/vigil",
    "vendor/quantabeta-core/crates/quantabeta-core",
    "vendor/quantabeta-core/crates/true-entropy",
    "vendor/quantabeta-core/crates/ramanujan-ops",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rug = { version = "1.24", features = ["rational", "float"] }
sha2 = "0.10"
hex = "0.4"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
