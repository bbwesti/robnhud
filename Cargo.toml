[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ingestor",
    "crates/worm",
    "crates/regime",
    "crates/quant",
    "crates/alerts",
    "crates/digest",
    "apps/vigil",
    "vendor/quantabeta-core/crates/quantabeta-core",
    "vendor/quantabeta-core/crates/true-entropy",
    "vendor/quantabeta-core/crates/ramanujan-ops",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rug = { version = "1.24", features = ["rational", "float"] }
sha2 = "0.10"
hex = "0.4"
