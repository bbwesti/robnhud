[package]
name = "quantabeta-bridge"
version = "0.1.0"
edition = "2021"
description = "Bridge between CRYPTEK VIGIL f64 prices and QuantaBeta exact rational arithmetic"

[dependencies]
rug = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
hex = "0.4"
quantabeta-core = { path = "../../vendor/quantabeta-core/crates/quantabeta-core" }
ramanujan-ops = { path = "../../vendor/quantabeta-core/crates/ramanujan-ops" }
true-entropy = { path = "../../vendor/quantabeta-core/crates/true-entropy" }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { workspace = true }
tracing = { workspace = true }
