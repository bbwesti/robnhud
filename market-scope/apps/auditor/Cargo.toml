[package]
name = "marketscope-auditor"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
authors = ["Ahmad Ali Parr"]
description = "MARKETSCOPE WORM chain auditor — lineage verification and SHA-256 sealed audit trail"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[dependencies.uuid]
version = "1"
features = ["v4", "serde"]
